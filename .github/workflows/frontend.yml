name: Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/openapi.yaml'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos del contrato, tests y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # schema.d.ts se genera desde el contrato: si cambió docs/openapi.yaml y no se
      # regeneró, el build local y el de CI divergirían.
      - name: Tipos del contrato al día
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
