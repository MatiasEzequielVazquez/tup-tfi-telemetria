# Servicios locales para desarrollo y tests (no se usan en producción).
#   docker compose -f docker-compose.dev.yml up -d     levanta todo
#   docker compose -f docker-compose.dev.yml down      lo baja (los datos quedan en los volúmenes)
name: tfi-telemetria

services:
  hivemq:
    image: hivemq/hivemq-ce
    container_name: tfi-hivemq
    ports:
      - "1883:1883"            # MQTT sin TLS: solo local
    volumes:
      - hivemq-data:/opt/hivemq/data   # sesiones persistentes sobreviven a un reinicio del broker
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine  # misma versión mayor que Supabase
    container_name: tfi-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"            # 5433 para no chocar con un PostgreSQL instalado en Windows
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hivemq-data:
  postgres-data: